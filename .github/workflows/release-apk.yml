name: Direct APK Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sarangsho-direct-release
  cancel-in-progress: false

jobs:
  signed-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Validate signing secrets and materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SNGSO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SNGSO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNGSO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNGSO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing SNGSO_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing SNGSO_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SNGSO_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SNGSO_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sarangsho-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sarangsho-signing/release.jks"
          test -s "$RUNNER_TEMP/sarangsho-signing/release.jks"
          echo "SNGSO_KEYSTORE_PATH=$RUNNER_TEMP/sarangsho-signing/release.jks" >> "$GITHUB_ENV"
          echo "SNGSO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SNGSO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SNGSO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate keystore alias and private key
        run: |
          set -euo pipefail
          KEY_DETAILS="$(keytool -list -v \
            -keystore "$SNGSO_KEYSTORE_PATH" \
            -storepass "$SNGSO_KEYSTORE_PASSWORD" \
            -alias "$SNGSO_KEY_ALIAS")"
          printf '%s\n' "$KEY_DETAILS" | grep -Fq "Entry type: PrivateKeyEntry"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and write checksum
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "Verified signed APK: $APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: sarangsho-plus-direct-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
