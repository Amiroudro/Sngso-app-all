name: Android UI CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Keep only the newest verification run for a PR. This prevents multiple
# queued builds from consuming the same limited Actions allowance.
concurrency:
  group: android-ui-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-build:
    # Routine PR gate. Manual dispatch is reserved for the emulator job.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicitly override the action's legacy default ("tools"), which
          # sdkmanager no longer provides. Install only current SDK packages.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Verify toolchain
        run: |
          ./gradlew --version
          java -version
          sdkmanager --list_installed
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile and assemble instrumentation test APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sarangsho-plus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # Emulator boot is comparatively expensive. For an unmerged PR this job
  # runs only for non-draft PRs and only after the routine build succeeds.
  # workflow_dispatch is also available for deliberate manual reruns.
  compose-instrumentation:
    needs: unit-and-build
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        needs.unit-and-build.result == 'success'))
    runs-on: ubuntu-24.04
    # GitHub-hosted Linux runners may not expose KVM. Recent Android Emulator
    # builds reject TCG software CPU emulation unless this explicit opt-in is set.
    env:
      ANDROID_I_WANT_MY_TCG: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Run Compose smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 AOSP keeps the guest system lighter on TCG-only hosted runners.
          # The app still compiles against SDK 35 and supports API 26+.
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 4
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v threadtime > emulator-logcat.txt &
            LOGCAT_PID=$!
            set +e
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            TEST_EXIT=$?
            kill "$LOGCAT_PID" || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            exit "$TEST_EXIT"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-instrumentation-diagnostics
          path: |
            emulator-logcat.txt
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
