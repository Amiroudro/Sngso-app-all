name: Android UI CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, feat/compose-ui-foundation, fix/android-build-verification]

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicitly override the action's legacy default ("tools"), which
          # sdkmanager no longer provides. Install only current SDK packages.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Verify toolchain
        run: |
          ./gradlew --version
          java -version
          sdkmanager --list_installed
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sarangsho-plus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  compose-instrumentation:
    # Use the stable 24.04 runner image for hardware-accelerated Android emulation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Keep this package list explicit so the obsolete "tools" package
          # is never requested by the setup action's default configuration.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Run Compose smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep the action's recommended software-rendering and snapshot settings.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
